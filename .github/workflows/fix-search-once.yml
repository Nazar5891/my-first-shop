name: Fix search flow once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = """  const handleSearch = () => {\n    setSubmittedSearchQuery(searchQuery.trim());\n    setActiveTab('search');\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  };"""
          new = """  const handleSearch = () => {\n    setSubmittedSearchQuery(searchQuery.trim());\n    setSelectedListing(null);\n    setDetailListing(null);\n    setActiveTab('map');\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  };"""
          if old not in s:
              raise SystemExit('handleSearch block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-search-once.yml
          git rm .github/workflows/fix-search-once.yml
          git commit -m 'fix: search applies filters and opens filtered map'
          git push
