name: Install new project

on:
  workflow_dispatch:
  push:
    paths:
      - 'помічник.zip'
      - 'trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf /tmp/pomichnyk
          mkdir -p /tmp/pomichnyk
          unzip -q 'помічник.zip' -d /tmp/pomichnyk

          shopt -s dotglob nullglob
          items=(/tmp/pomichnyk/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            source_dir="${items[0]}"
          else
            source_dir="/tmp/pomichnyk"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$source_dir"/. .
          rm -f 'помічник.zip' 'trigger.txt'

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Встановлено новий проєкт помічника'
            git push
          fi
