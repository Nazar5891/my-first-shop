name: Fix GPS auto-location
on:
  push:
    paths:
      - '.github/workflows/fix-gps-auto.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable automatic GPS request
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MapView.tsx')
          s = p.read_text()
          old = """  useEffect(() => {\n    if (!setUserCoordinates) return;\n    requestGPS();\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);"""
          new = """  useEffect(() => {\n    onGpsStatusChange?.(false);\n  }, [onGpsStatusChange]);"""
          if old not in s:
              raise SystemExit('Expected GPS auto-request block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MapView.tsx
          git commit -m 'fix: do not auto-request GPS on map load'
          rm .github/workflows/fix-gps-auto.yml
          git add .github/workflows/fix-gps-auto.yml
          git commit -m 'chore: remove temporary GPS fix workflow'
          git push
