<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Друзі Онлайн — соціальна мережа</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Arial,sans-serif}.glass{backdrop-filter:blur(18px);background:rgba(255,255,255,.92)}.story-ring{background:linear-gradient(135deg,#2563eb,#facc15,#ec4899)}
.modal{background:rgba(15,23,42,.65);backdrop-filter:blur(5px)}
</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<header class="sticky top-0 z-30 border-b border-white/70 glass">
<div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between lg:px-8">
<div class="flex items-center gap-3"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600 text-xl font-black text-white">Д</div><div><h1 class="text-xl font-extrabold">Друзі Онлайн</h1><p class="text-xs text-slate-500">Українська соціальна мережа</p></div></div>
<div class="flex w-full gap-2 sm:w-auto"><input id="search" class="w-full rounded-full border bg-white px-4 py-2.5 outline-none focus:border-blue-500 sm:w-72" placeholder="Пошук..."><button id="loginBtn" class="rounded-full bg-blue-600 px-5 py-2.5 font-bold text-white">Увійти</button></div>
</div></header>
<main class="mx-auto grid max-w-7xl gap-6 px-4 py-6 lg:grid-cols-[260px_minmax(0,1fr)_300px] lg:px-8">
<aside class="space-y-4">
<section class="rounded-3xl bg-white p-5 shadow-sm"><div class="flex items-center gap-4"><div id="avatar" class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-100 text-2xl">👤</div><div class="min-w-0"><h2 id="profileName" class="truncate text-lg font-bold">Гість</h2><p id="profileNick" class="truncate text-sm text-slate-500">Увійдіть у свій профіль</p></div></div><div class="mt-5 grid grid-cols-3 rounded-2xl bg-slate-50 p-3 text-center"><div><b id="postCount">0</b><small class="block text-xs text-slate-500">дописів</small></div><div><b id="friendCount">0</b><small class="block text-xs text-slate-500">друзів</small></div><div><b id="likeCount">0</b><small class="block text-xs text-slate-500">лайків</small></div></div></section>
<nav class="rounded-3xl bg-white p-3 shadow-sm"><a class="block rounded-2xl bg-blue-50 px-4 py-3 font-semibold text-blue-700" href="#feed">🏠 Стрічка</a><button id="profileBtn" class="block w-full rounded-2xl px-4 py-3 text-left font-semibold hover:bg-slate-50">👤 Мій профіль</button><button id="messagesBtn" class="block w-full rounded-2xl px-4 py-3 text-left font-semibold hover:bg-slate-50">💬 Повідомлення</button><button id="notificationsBtn" class="block w-full rounded-2xl px-4 py-3 text-left font-semibold hover:bg-slate-50">🔔 Сповіщення <span class="ml-1 rounded-full bg-red-500 px-2 text-xs text-white">3</span></button><a class="block rounded-2xl px-4 py-3 font-semibold hover:bg-slate-50" href="#friends">👥 Друзі</a></nav>
</aside>
<section id="feed" class="space-y-5">
<div class="rounded-3xl bg-white p-5 shadow-sm"><div class="mb-4 flex items-center justify-between"><h2 class="text-lg font-bold">Історії</h2><button class="text-sm font-bold text-blue-600">Додати історію</button></div><div class="flex gap-5 overflow-x-auto"><button class="min-w-16 text-center"><div class="story-ring rounded-2xl p-1"><div class="rounded-xl bg-white p-3 text-2xl">➕</div></div><small>Ви</small></button><button class="min-w-16 text-center"><div class="story-ring rounded-2xl p-1"><div class="rounded-xl bg-white p-3 text-2xl">📷</div></div><small>Андрій</small></button><button class="min-w-16 text-center"><div class="story-ring rounded-2xl p-1"><div class="rounded-xl bg-white p-3 text-2xl">🌞</div></div><small>Марія</small></button><button class="min-w-16 text-center"><div class="story-ring rounded-2xl p-1"><div class="rounded-xl bg-white p-3 text-2xl">🌲</div></div><small>Ігор</small></button></div></div>
<form id="postForm" class="rounded-3xl bg-white p-5 shadow-sm"><div class="flex items-start gap-3"><div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-blue-100">👤</div><textarea id="postText" maxlength="500" class="min-h-24 w-full resize-none rounded-2xl border p-4 outline-none focus:border-blue-500" placeholder="Що у вас нового?"></textarea></div><div class="mt-4 flex items-center justify-between"><span id="counter" class="text-sm text-slate-500">0 / 500</span><button class="rounded-full bg-blue-600 px-6 py-3 font-bold text-white" type="submit">Опублікувати</button></div></form>
<div id="posts" class="space-y-5"></div>
</section>
<aside class="space-y-5"><section id="friends" class="rounded-3xl bg-white p-5 shadow-sm"><div class="flex items-center justify-between"><h2 class="text-lg font-extrabold">Друзі</h2><button id="allFriends" class="text-sm font-bold text-blue-600">Усі</button></div><div id="friendList" class="mt-4 space-y-4"></div></section><section class="rounded-3xl bg-blue-600 p-5 text-white shadow-sm"><p class="text-sm font-bold text-blue-100">ПОДІЯ ТИЖНЯ</p><h2 class="mt-2 text-2xl font-extrabold">Онлайн-зустріч громади</h2><p class="mt-2 text-blue-100">П'ятниця, 19:00. Знайомимось та обговорюємо ідеї.</p><button id="joinEvent" class="mt-5 rounded-full bg-white px-5 py-2.5 font-bold text-blue-700">Приєднатись</button></section></aside>
</main>
<div id="modal" class="modal fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl"><div class="flex items-center justify-between"><h2 id="modalTitle" class="text-2xl font-extrabold">Вхід</h2><button id="closeModal" class="text-2xl text-slate-400">×</button></div><div id="modalBody" class="mt-5"></div></div></div>
<script>
const key='friends-online-v2';
let state=JSON.parse(localStorage.getItem(key)||'null')||{user:null,posts:[{id:1,author:'Андрій Мельник',text:'Запускаємо нову ініціативу у громаді. Хто готовий допомогти?',likes:12,liked:false,comments:['Можу допомогти!']},{id:2,author:'Марія Савчук',text:'Сьогодні чудовий день для прогулянки та кави ☀️',likes:8,liked:false,comments:[]}],friends:[]};
const friends=[['Андрій Мельник','👨'],['Марія Савчук','👩'],['Ігор Петренко','👨'],['Наталя Бойко','👩']];
const save=()=>localStorage.setItem(key,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderFriends(){document.querySelector('#friendList').innerHTML=friends.slice(0,3).map((f,i)=>`<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-3"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-100">${f[1]}</div><b class="text-sm">${f[0]}</b></div><button data-i="${i}" class="addFriend rounded-full bg-blue-50 px-3 py-2 text-sm font-bold text-blue-700">${state.friends.includes(i)?'Додано':'Додати'}</button></div>`).join('');document.querySelectorAll('.addFriend').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(!state.friends.includes(i))state.friends.push(i);else state.friends=state.friends.filter(x=>x!==i);save();render()})}
function render(){let q=document.querySelector('#search').value.toLowerCase();let posts=state.posts.filter(p=>(p.author+' '+p.text).toLowerCase().includes(q));document.querySelector('#posts').innerHTML='';posts.forEach(p=>{let el=document.createElement('article');el.className='rounded-3xl bg-white p-5 shadow-sm';el.innerHTML=`<div class="flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100">👤</div><div><b>${esc(p.author)}</b><p class="text-sm text-slate-500">публічно • щойно</p></div></div><p class="mt-4 whitespace-pre-wrap text-lg leading-relaxed text-slate-700">${esc(p.text)}</p><div class="mt-5 flex flex-wrap gap-2 border-t pt-4"><button class="like rounded-full bg-slate-100 px-4 py-2 font-semibold">${p.liked?'♥':'♡'} Подобається</button><button class="comment rounded-full bg-slate-100 px-4 py-2 font-semibold">💬 Коментар</button><button class="share rounded-full bg-slate-100 px-4 py-2 font-semibold">↗ Поділитися</button><span class="px-2 py-2 text-sm text-slate-500">${p.likes} вподобань</span></div><div class="comments mt-3"></div>`;el.querySelector('.like').onclick=()=>{p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()};el.querySelector('.comment').onclick=()=>{let t=prompt('Напишіть коментар:');if(t&&t.trim()){p.comments.push(t.trim());save();render()}};el.querySelector('.share').onclick=()=>navigator.clipboard?.writeText(location.href).then(()=>alert('Посилання скопійовано'));p.comments.forEach(c=>{let d=document.createElement('p');d.className='mt-2 rounded-2xl bg-slate-50 px-4 py-2 text-sm';d.textContent='💬 '+c;el.querySelector('.comments').appendChild(d)});document.querySelector('#posts').appendChild(el)});document.querySelector('#postCount').textContent=state.posts.length;document.querySelector('#friendCount').textContent=state.friends.length;document.querySelector('#likeCount').textContent=state.posts.reduce((s,p)=>s+p.likes,0);document.querySelector('#profileName').textContent=state.user?.name||'Гість';document.querySelector('#profileNick').textContent=state.user?'@'+state.user.nick:'Увійдіть у свій профіль';document.querySelector('#loginBtn').textContent=state.user?'Мій акаунт':'Увійти';renderFriends()}
function openLogin(){document.querySelector('#modalTitle').textContent='Вхід / Реєстрація';document.querySelector('#modalBody').innerHTML=`<p class="text-slate-500">Зараз це локальний режим. Наступним кроком підключимо справжню базу даних, щоб акаунти та дописи були доступні з різних телефонів.</p><input id="name" class="mt-4 w-full rounded-2xl border p-3" placeholder="Ваше ім'я"><input id="nick" class="mt-3 w-full rounded-2xl border p-3" placeholder="Логін"><button id="saveUser" class="mt-4 w-full rounded-full bg-blue-600 py-3 font-bold text-white">Створити профіль</button>`;document.querySelector('#modal').classList.remove('hidden');document.querySelector('#modal').classList.add('flex');document.querySelector('#saveUser').onclick=()=>{let name=document.querySelector('#name').value.trim(),nick=document.querySelector('#nick').value.trim().replace(/\s/g,'').toLowerCase();if(!name||!nick)return alert('Заповніть ім’я та логін');state.user={name,nick};save();closeModal();render()}}
function closeModal(){document.querySelector('#modal').classList.add('hidden');document.querySelector('#modal').classList.remove('flex')}
document.querySelector('#loginBtn').onclick=openLogin;document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#search').oninput=render;document.querySelector('#postText').oninput=e=>document.querySelector('#counter').textContent=e.target.value.length+' / 500';document.querySelector('#postForm').onsubmit=e=>{e.preventDefault();let t=document.querySelector('#postText').value.trim();if(!t)return;if(!state.user){openLogin();return}state.posts.unshift({id:Date.now(),author:state.user.name,text:t,likes:0,liked:false,comments:[]});save();e.target.reset();document.querySelector('#counter').textContent='0 / 500';render()};document.querySelector('#profileBtn').onclick=()=>openLogin();document.querySelector('#messagesBtn').onclick=()=>alert('Розділ повідомлень готуємо до підключення бази даних.');document.querySelector('#notificationsBtn').onclick=()=>alert('У вас 3 нові сповіщення.');document.querySelector('#joinEvent').onclick=()=>alert('Ви приєдналися до події!');render();
</script>
</body></html>
